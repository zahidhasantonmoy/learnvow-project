# LearnVow — nginx for the Northflank container.
# The entrypoint replaces __PORT__ with $PORT (default 8080).
server {
    listen __PORT__ default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Static assets with a long cache (Vite hashes filenames).
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
